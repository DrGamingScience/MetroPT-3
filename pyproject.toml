[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metropt3"
dynamic = ["version"]
description = "Reproducible anomaly detection experiments for MetroPT-3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "PyYAML>=6.0",
    "joblib",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
pyod = ["pyod"]

[project.scripts]
metropt3 = "metropt3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "metropt3.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
